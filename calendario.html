<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Calendario de voluntarios · Evangelio &amp; Vida</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--ol:#6C7939;--od:#5b6630;--mt:#F0F3E8;--rj:#A8222B;--tx:#1A1A1A;--bd:#cfd6bb}
*{box-sizing:border-box}
body{margin:0;background:var(--mt);color:var(--tx);font:15px/1.5 Poppins,system-ui,sans-serif}
header{background:var(--ol);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.hi{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:1.2rem;font-weight:800;line-height:1.2}header small{opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.05rem;font-weight:800;color:var(--ol)}
input,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff}
button{font:inherit;font-weight:600;padding:8px 14px;border:0;border-radius:9px;background:var(--ol);color:#fff;cursor:pointer}
button:hover{background:var(--od)}button.w{background:#fff;color:var(--ol);border:1.5px solid var(--ol)}button.w:hover{background:var(--mt)}
button.r{background:var(--rj)}button.s{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:3px solid #6C793966}
[hidden]{display:none!important}
.reg{max-width:420px;margin:40px auto}.reg label{display:block;font-weight:600;margin:12px 0 4px}
.err{color:var(--rj);font-weight:600;margin:10px 0 0}
.cd{display:flex;justify-content:space-between;align-items:center;gap:12px;border-left:5px solid var(--ol)}
.cd b.n{font-size:2rem;font-weight:800;color:var(--ol);display:block;line-height:1}.cd .d{background:var(--mt);border-radius:12px;padding:8px 16px;text-align:center;font-size:.75rem}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}.prog .card{margin:0}
.pt{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}.pt b{font-size:1.6rem;font-weight:800}
.bar{height:12px;background:#e8ebe0;border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ol);transition:width .8s}
.em{background:#A8222B14;border-color:#A8222B55}.em h2{color:var(--rj)}
.em .it{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;color:#666;border-radius:10px 10px 0 0;white-space:nowrap}.tabs button[aria-selected=true]{background:#fff;color:var(--ol);box-shadow:0 -1px 0 var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.eqb{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:left;color:var(--tx);min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.eqb:hover{border-color:var(--ol);background:#fff}.eqb b{font-size:1.05rem;line-height:1.2}.eqb small{color:#666;font-weight:400}
.tk{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.tk.done{background:#eef5e6;opacity:.75}.tk.done b{text-decoration:line-through}
.tkm{display:flex;gap:10px;align-items:flex-start}.tkm input{width:20px;height:20px;margin-top:3px;accent-color:var(--ol);flex:none}
.eq{color:var(--ol);font-weight:600;font-size:.85rem}.fe,.cu{font-size:.8rem;color:#666}.cu{color:var(--ol);font-weight:500}
.tkr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.cnt{font-size:.8rem;font-weight:600;background:#f1f2ee;padding:3px 9px;border-radius:6px}.yo{font-size:.8rem;font-weight:600;color:var(--ol)}
.dia{margin:18px 0 8px;font-weight:800;color:var(--ol);text-transform:capitalize}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.mo{background:var(--mt);width:100%;max-width:680px;max-height:92vh;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.mh{background:var(--ol);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.mh h2{color:#fff;margin:0;font-size:1.15rem}
.mb{overflow:auto;padding:16px}.mb h3{margin:18px 0 10px;font-size:1rem}
.ins{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem}
.falta{font-size:.7rem;font-weight:800;color:var(--rj);background:#A8222B18;padding:2px 8px;border-radius:6px}
details{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}summary{cursor:pointer;font-weight:600;color:var(--ol)}details input{margin-top:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:10px;z-index:40;font-size:.9rem}
table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}th{background:var(--mt)}
</style>
</head>
<body>
<header><div class="hi"><div><h1>Evangelio &amp; Vida</h1><small>Calendario de voluntarios</small></div><div id="who"></div></div></header>

<main>
  <form id="reg" class="card reg" hidden>
    <h2 style="font-size:1.5rem">Unirte al equipo</h2>
    <p style="margin-top:0;color:#555">Conferencia: Instrumentos en las Manos del Redentor</p>
    <label for="rn">Nombre completo</label><input id="rn" autocomplete="name" placeholder="Ej. Juan Pérez" required>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px">
      <div><label for="ra">Edad</label><input id="ra" type="number" min="12" max="99" inputmode="numeric" placeholder="25" required></div>
      <div><label for="rw">WhatsApp</label><input id="rw" type="tel" autocomplete="tel" placeholder="+595 9xx xxx xxx" required></div>
    </div>
    <p class="err" id="re" role="alert" hidden></p>
    <button style="width:100%;margin-top:16px;padding:13px">Ingresar al calendario</button>
    <p style="font-size:.8rem;color:#666;margin-bottom:0">Si ya te registraste antes, usa el mismo WhatsApp y recuperas tus tareas.</p>
  </form>

  <div id="app" hidden>
    <div class="card cd"><div><h2 style="margin:0">Conferencia Lois Kehlenbrink</h2><span style="color:#666;font-size:.9rem">20 al 22 de noviembre, 2026</span></div><div class="d"><b class="n" id="dias">0</b>días faltan</div></div>
    <div class="prog" id="prog"></div>
    <div id="em"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="vista"></div>
  </div>
</main>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
// ====== CONFIGURACIÓN: la misma URL y clave anon del formulario ======
const CFG = { URL: 'https://TU-PROYECTO.supabase.co', KEY: 'TU_ANON_PUBLIC_KEY', EVENTO: '2026-11-20T00:00:00' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
let user = store.get('vol'), S = {t: [], i: [], a: {}, m: new Set()}, tab = 'eq', team = null, fEq = '';

const H = tk => ({apikey: CFG.KEY, Authorization: 'Bearer ' + (tk || CFG.KEY), 'Content-Type': 'application/json'});
const get = (p, tk) => fetch(CFG.URL + '/rest/v1/' + p, {headers: H(tk)}).then(r => r.ok ? r.json() : Promise.reject(new Error('No se pudieron cargar los datos.')));
const rpc = (f, b) => fetch(CFG.URL + '/rest/v1/rpc/' + f, {method: 'POST', headers: H(), body: JSON.stringify(b)}).then(r => r.ok ? r.json() : Promise.reject(new Error('Sin conexión. Intenta de nuevo.')));
function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }

// ---- datos derivados
const vols = t => S.a[t.id] || [];
const ilim = t => t.necesarios >= 50;
const cubierta = t => ilim(t) ? vols(t).length > 0 : vols(t).length >= t.necesarios;
const equipos = () => [...new Set(S.t.map(t => t.equipo))];
const dia = t => new Date(t.orden.slice(0, 10) + 'T12:00').toLocaleDateString('es', {weekday: 'long', day: 'numeric', month: 'long'});
const byOrden = (a, b) => a.orden.localeCompare(b.orden) || a.id - b.id;

async function load() {
  try {
    const [t, i, a, m] = await Promise.all([get('tareas?select=*&order=id'), get('insumos?select=*&order=id'), get('asignaciones_publicas?select=*'), user ? rpc('mis_tareas', {p_vol: user.id}) : []]);
    S.t = t; S.i = i; S.a = {}; a.forEach(x => (S.a[x.tarea_id] = S.a[x.tarea_id] || []).push(x.nombre)); S.m = new Set(m);
    render();
  } catch (e) { toast(e.message); }
}

// ---- piezas
function taskRow(t, showTeam) {
  const v = vols(t), mine = S.m.has(t.id), full = !ilim(t) && v.length >= t.necesarios;
  return `<div class="tk${t.completada ? ' done' : ''}"><div class="tkm">${t.es_checkable ? `<input type="checkbox" data-a="done" data-v="${t.id}" ${t.completada ? 'checked' : ''} aria-label="Marcar como hecha">` : ''}
    <div><b>${esc(t.titulo)}</b>${showTeam ? `<div class="eq">${esc(t.equipo)}</div>` : ''}<div class="fe">📅 ${esc(t.fecha_texto)}</div>${v.length ? `<div class="cu">Cubierto por: ${v.map(esc).join(', ')}</div>` : ''}</div></div>
    <div class="tkr"><span class="cnt">${v.length} / ${ilim(t) ? 'Ilimitado' : t.necesarios}</span>
    ${mine ? `<span class="yo">¡Anotado!</span><button class="w s" data-a="leave" data-v="${t.id}">Salir</button>` : (!full && !t.completada ? `<button class="s" data-a="join" data-v="${t.id}">Unirme</button>` : '')}</div></div>`;
}
const pbar = (titulo, p, fest) => `<div class="card"><div class="pt"><span>${titulo}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>${fest ? '<p style="margin:8px 0 0;text-align:center;color:var(--ol);font-weight:600;font-size:.85rem">¡Completado al 100%! 🎉</p>' : ''}</div>`;

function render() {
  if (!user) { $('reg').hidden = false; $('app').hidden = true; $('who').innerHTML = ''; return; }
  $('reg').hidden = true; $('app').hidden = false;
  $('who').innerHTML = `<span style="background:#0002;padding:6px 12px;border-radius:10px;font-weight:600">${esc(user.nombre)}</span> <button class="w s" data-a="salirSesion" style="margin-left:6px">Salir</button>`;
  $('dias').textContent = Math.max(0, Math.ceil((new Date(CFG.EVENTO) - Date.now()) / 864e5));
  const med = S.t.filter(t => !ilim(t)), tot = med.reduce((a, t) => a + t.necesarios, 0), ll = med.reduce((a, t) => a + Math.min(vols(t).length, t.necesarios), 0);
  const pt = tot ? Math.round(ll / tot * 100) : 100, pi = S.i.length ? Math.round(S.i.filter(i => i.cubierto_por).length / S.i.length * 100) : 100;
  $('prog').innerHTML = pbar('Áreas cubiertas', pt) + pbar('Insumos cubiertos', pi, pi === 100 && S.i.length > 0);
  const ut = S.t.filter(t => !cubierta(t)).sort(byOrden), ui = S.i.filter(i => !i.cubierto_por);
  $('em').innerHTML = ut.length || ui.length ? `<div class="card em"><h2>⚠ Área de emergencia</h2>
    ${ut.slice(0, 3).map(t => `<div class="it"><div><b>${esc(t.equipo)}</b>: ${esc(t.titulo)}<div class="fe">${ilim(t) ? 'Nadie anotado' : 'Faltan ' + (t.necesarios - vols(t).length) + ' personas'} · ${esc(t.fecha_texto)}</div></div><button class="w s" data-a="team" data-v="${esc(t.equipo)}">Ver</button></div>`).join('')}
    ${ui.slice(0, 2).map(i => `<div class="it" style="border-left:4px solid #e0963a"><div><b>Insumo (${esc(i.equipo)})</b>: ${esc(i.nombre)}<div class="fe">Entregar a: ${esc(i.entregar_a)} · Fecha: ${esc(i.fecha_texto)}</div></div><button class="w s" data-a="team" data-v="${esc(i.equipo)}">Traer</button></div>`).join('')}</div>` : '';
  const mias = S.t.filter(t => S.m.has(t.id));
  $('tabs').innerHTML = [['eq', 'Equipos'], ['mis', `Mis tareas (${mias.length})`], ['cal', 'Calendario general']].map(([k, n]) => `<button role="tab" aria-selected="${tab === k}" data-a="tab" data-v="${k}">${n}</button>`).join('');
  if (tab === 'eq') $('vista').innerHTML = `<div class="grid">${equipos().map(e => { const ts = S.t.filter(t => t.equipo === e), ok = ts.filter(cubierta).length;
    return `<button class="eqb" data-a="team" data-v="${esc(e)}"><b>${esc(e)}</b><div><div class="bar"><i style="width:${Math.round(ok / ts.length * 100)}%"></i></div><small>${ok} de ${ts.length} tareas listas</small></div></button>`; }).join('')}</div>`;
  if (tab === 'mis') $('vista').innerHTML = mias.length ? [...mias].sort(byOrden).map(t => taskRow(t, true)).join('') : '<div class="card">Todavía no te anotaste en ninguna tarea. Elige un equipo y toca «Unirme».</div>';
  if (tab === 'cal') {
    const ts = S.t.filter(t => !fEq || t.equipo === fEq).sort(byOrden); let last = '';
    $('vista').innerHTML = `<select id="fEq" aria-label="Filtrar por equipo" style="margin-bottom:6px"><option value="">Todos los equipos</option>${equipos().map(e => `<option ${e === fEq ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>` +
      ts.map(t => { const d = dia(t), h = d !== last ? `<div class="dia">${esc(d)}</div>` : ''; last = d; return h + taskRow(t, true); }).join('');
  }
  renderModal();
}
function renderModal() {
  if (!team) { $('modal').innerHTML = ''; return; }
  const ts = S.t.filter(t => t.equipo === team).sort(byOrden), is = S.i.filter(i => i.equipo === team);
  $('modal').innerHTML = `<div class="ov" data-a="closeBg"><div class="mo" role="dialog" aria-modal="true" aria-label="${esc(team)}"><div class="mh"><h2>${esc(team)}</h2><button class="w s" data-a="close" aria-label="Cerrar">✕</button></div><div class="mb">
    <h3 style="margin-top:0">✔ Tareas y voluntarios</h3>${ts.map(t => taskRow(t, false)).join('')}
    <h3>📦 Insumos necesarios</h3>
    ${is.map(i => `<div class="ins"><div><b>${esc(i.nombre)}</b><div class="fe">Para: ${esc(i.fecha_texto)}</div><div class="fe">Entregar a: <b>${esc(i.entregar_a)}</b></div></div>
      ${i.cubierto_por ? `<span class="yo">Trae: ${esc(i.cubierto_nombre)}</span>` : `<div style="text-align:right"><span class="falta">Falta</span><br><button class="w s" style="margin-top:6px" data-a="cover" data-v="${i.id}">Yo lo traigo</button></div>`}</div>`).join('') || '<p style="color:#666">No se registraron insumos aún.</p>'}
    <details><summary>Agregar un insumo</summary><form id="fIns"><input name="n" placeholder="Nombre del insumo" required maxlength="120"><input name="f" placeholder="Fecha (Ej. 20/11)" required maxlength="40"><input name="e" placeholder="A quién entregar" required maxlength="120"><button style="margin-top:10px">Guardar insumo</button></form></details></div></div></div>`;
}

// ---- acciones
const MSG = {lleno: 'Esa tarea ya se completó. Elige otra.', sin_registro: 'Vuelve a registrarte para continuar.'};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'closeBg' && e.target !== el) return;
  try {
    if (a === 'tab') { tab = v; render(); }
    else if (a === 'team') { team = v; renderModal(); }
    else if (a === 'close' || a === 'closeBg') { team = null; renderModal(); }
    else if (a === 'salirSesion') { store.del('vol'); user = null; S.m = new Set(); render(); }
    else if (a === 'join') { const r = await rpc('unirse_tarea', {p_vol: user.id, p_tarea: +v}); if (MSG[r]) toast(MSG[r]); await load(); }
    else if (a === 'leave') { await rpc('salir_tarea', {p_vol: user.id, p_tarea: +v}); await load(); }
    else if (a === 'cover') { if (!(await rpc('cubrir_insumo', {p_vol: user.id, p_insumo: +v}))) toast('Alguien ya se anotó para traerlo.'); await load(); }
  } catch (x) { toast(x.message); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'fEq') { fEq = el.value; render(); }
  if (el.dataset.a === 'done') { try { await rpc('marcar_tarea', {p_vol: user.id, p_tarea: +el.dataset.v, p_hecha: el.checked}); await load(); } catch (x) { toast(x.message); } }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fIns') return; e.preventDefault();
  const f = new FormData(e.target);
  try { await rpc('agregar_insumo', {p_vol: user.id, p_equipo: team, p_nombre: f.get('n'), p_fecha: f.get('f'), p_entregar: f.get('e')}); toast('Insumo agregado.'); await load(); } catch (x) { toast(x.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && team) { team = null; renderModal(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && user && !team) load(); });

$('reg').onsubmit = async e => {
  e.preventDefault(); $('re').hidden = true;
  const nombre = $('rn').value.trim(), edad = parseInt($('ra').value, 10), wa = $('rw').value.trim();
  if (nombre.length < 2 || !(edad >= 12 && edad <= 99) || wa.replace(/\D/g, '').length < 6) { $('re').textContent = 'Revisa que el nombre, la edad y el WhatsApp estén completos.'; $('re').hidden = false; return; }
  try { user = await rpc('registrar_voluntario', {p_nombre: nombre, p_edad: edad, p_whatsapp: wa}); store.set('vol', user); await load(); }
  catch (x) { $('re').textContent = x.message; $('re').hidden = false; }
};

render(); if (user) load(); else get('tareas?select=id&limit=1').catch(() => {});
</script>
</body>
</html>
